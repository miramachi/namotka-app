<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Намотка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1b1b1b);
    --hint: var(--tg-theme-hint-color, #8a8a8a);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --accent: var(--tg-theme-button-color, #2a7ae2);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --bad: #d93a3a;
    --good: #1f9d55;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .who { color: var(--hint); font-size: 14px; margin-bottom: 16px; }
  .step { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    color: var(--hint); margin: 4px 0 8px; }
  .docs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .ops { display: grid; gap: 8px; margin-bottom: 16px; }
  .docs button, .ops button { text-align: left; padding: 12px 14px; border-radius: 10px; border: 2px solid transparent;
    background: var(--card); color: var(--text); font-size: 16px; }
  .docs button.on, .ops button.on { border-color: var(--accent); }
  label { display: block; margin: 12px 0 4px; font-size: 14px; color: var(--hint); }
  input, select, textarea { width: 100%; padding: 12px; border-radius: 10px; border: 0;
    background: var(--card); color: var(--text); font-size: 16px; }
  textarea { min-height: 60px; resize: vertical; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--text); }
  .check input { width: auto; margin: 0; }
  details.sec { margin-top: 12px; }
  details.sec > summary { padding: 12px 14px; border-radius: 10px; background: var(--card); font-weight: 600; cursor: pointer; }
  .total { margin-top: 10px; font-size: 14px; color: var(--hint); }
  .send { width: 100%; margin-top: 18px; padding: 14px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-text); font-size: 17px; font-weight: 600; }
  .send:disabled { opacity: .5; }
  .msg { margin-top: 14px; padding: 12px; border-radius: 10px; background: var(--card); white-space: pre-wrap; }
  .msg.good { border-left: 4px solid var(--good); }
  .msg.bad { border-left: 4px solid var(--bad); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
  .group { margin-top: 18px; font-weight: 600; }
  [hidden] { display: none !important; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--card); padding: 4px; border-radius: 12px; margin-bottom: 16px; }
  .tabs button { border: 0; padding: 10px; border-radius: 9px; background: transparent; font-size: 15px; color: var(--text); }
  .tabs button.on { background: var(--bg); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .row { background: var(--card); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .row .top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--hint); }
  .row .what { font-weight: 600; margin: 2px 0; }
  .jlist { max-height: 60vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .jlist .row { cursor: pointer; }
  .back { background: none; border: 0; color: var(--accent); font-size: 16px; padding: 4px 0 8px; }
  .ok { color: var(--good); font-weight: 600; }
  .no { color: var(--bad); font-weight: 600; }
  .why { font-size: 14px; color: var(--bad); }
  .sub { font-size: 13px; color: var(--hint); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td { padding: 7px 4px; border-bottom: 1px solid var(--card); }
  td.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.n.sub { white-space: normal; }
</style>
</head>
<body>
<h1>Намотка</h1>
<div class="who" id="who">Загрузка…</div>
<div class="tabs" id="tabs" hidden><button id="tab-docs" class="on">Документы</button><button id="tab-rep">Отчёты</button></div>

<div id="form" hidden>
  <div class="step">Документ</div>
  <div class="docs" id="docs"></div>
  <div id="opsBox" hidden>
    <div class="step">Операция</div>
    <div class="ops" id="ops"></div>
  </div>
  <div id="journalBox" hidden>
    <button class="send" id="j-new" style="margin-top:0">Добавить</button>
    <div class="step" style="margin-top:16px" id="j-title">Журнал</div>
    <div class="jlist" id="j-list"></div>
  </div>
  <div id="viewBox" hidden>
    <button class="back" id="v-back">← Назад к журналу</button>
    <div id="v-body"></div>
  </div>
  <div id="fields" hidden>
    <button class="back" id="f-back">← Назад к журналу</button>
    <div class="step">Новая операция</div>
    <label for="date">Дата</label>
    <input id="date" type="date" min="2026-10-15">
    <div id="f-metres"><label for="metres">Оптоволокно, м</label><input id="metres" inputmode="numeric"></div>
    <div id="f-qty"><label for="qty">Количество катушек, шт.</label><input id="qty" inputmode="numeric"></div>
    <div id="f-length"><label for="length">Длина одной катушки, м</label><select id="length"></select></div>
    <div id="f-product"><label for="productLength" id="productLabel">Изделие</label><select id="productLength"></select></div>
    <label for="note">Примечание</label>
    <textarea id="note"></textarea>
    <div class="total" id="total"></div>
    <button class="send" id="send">Провести</button>
  </div>
  <div id="openingBox" hidden>
    <div class="step">Остатки на начало учёта</div>
    <div class="total">По физическому пересчёту. Пусто — не посчитано, 0 — нет. В журнал операций не пишется.</div>
    <div><label for="op-date">Дата пересчёта</label><input id="op-date" type="date"></div>
    <div id="op-fibre"></div>
    <div id="op-groups"></div>
    <div class="total" id="op-entered"></div>
    <button class="send" id="op-save">Сохранить остатки</button>
  </div>
</div>
<div id="repBox" hidden>
  <div class="grid2">
    <div><label for="r-from">С</label><input id="r-from" type="date" min="2026-10-15"></div>
    <div><label for="r-to">По</label><input id="r-to" type="date" min="2026-10-15"></div>
  </div>
  <div id="r-emptyBox" style="margin-top:14px"><label class="check"><input type="checkbox" id="r-empty"> Показывать пустые</label></div>
  <button class="send" id="r-show">Показать</button>
  <div id="r-ops"></div>
  <div id="r-bal"></div>
</div>
<div class="msg" id="msg" hidden></div>

<script>
// Адрес веб-приложения Apps Script (…/exec) — подставляется после развёртывания.
const API = 'https://script.google.com/macros/s/AKfycbz-x01FQbjYLgJY9__f5O67K8hzfKtogNAMpotEblh60CQEkMQk1hcVYXdPmlsqIsTF/exec';
const tg = window.Telegram && Telegram.WebApp;
const $ = id => document.getElementById(id);
let rules = [], rule = null, clientId = newId(), failedSig = null;

function newId() { return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)); }
function today() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function show(text, kind) { const m = $('msg'); m.hidden = !text; m.textContent = text || ''; m.className = 'msg ' + (kind || ''); }
function num(v) { return Number(String(v).replace(/\s/g, '').replace(',', '.')); }

async function api(body) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ initData: tg ? tg.initData : '' }, body)) });
  if (!r.ok) throw new Error('Сервер ответил ' + r.status);
  return r.json();
}

// Дата по умолчанию — сегодня (до начала учёта — его первый день); новый документ снова начинается с неё.
function defaultDate() { return today() < $('date').min ? $('date').min : today(); }

function pickDoc(doc, btn) {
  rule = null; $('date').value = defaultDate();
  document.querySelectorAll('.docs button').forEach(b => b.classList.toggle('on', b === btn));
  $('ops').innerHTML = '';
  rules.filter(x => x.doc === doc).forEach(x => {
    const b = document.createElement('button');
    b.textContent = x.op;
    b.onclick = () => pick(x, b); $('ops').append(b);
  });
  $('opsBox').hidden = false; $('fields').hidden = true; $('openingBox').hidden = true; hideJournal(); clearFields(); show('');
}

function pick(r, btn) {
  rule = r;
  document.querySelectorAll('.ops button').forEach(b => b.classList.toggle('on', b === btn));
  $('fields').hidden = false;
  $('f-metres').hidden = r.mode !== 'metres';
  $('f-qty').hidden = r.mode === 'metres';
  $('f-length').hidden = r.mode !== 'winding';
  $('f-product').hidden = !r.product;
  $('productLabel').textContent = r.coil ? 'Длина катушки' : 'Изделие';
  clearFields(); show('');
  // Выбор операции открывает её журнал; форма — по «Добавить» (слово владельца 14.10).
  $('fields').hidden = true; showJournal(); loadJournal();
}

// Журнал вида операций: список свежих сверху, операция открывается для чтения, «Назад» — к списку.
let journal = [], backFn = null;
function setBack(fn) {
  backFn = fn;
  if (tg && tg.BackButton) { if (fn) tg.BackButton.show(); else tg.BackButton.hide(); }
}
function hideJournal() { $('journalBox').hidden = true; $('viewBox').hidden = true; setBack(null); }
function showJournal() { $('fields').hidden = true; $('viewBox').hidden = true; $('journalBox').hidden = false; setBack(null); }
function newOp() { $('journalBox').hidden = true; $('viewBox').hidden = true; $('fields').hidden = false; clearFields(); show(''); setBack(showJournal); }
async function loadJournal() {
  const r0 = rule;
  $('j-title').textContent = 'Журнал: ' + r0.doc + ' / ' + r0.op; $('j-list').innerHTML = '<div class="total">Загружаю…</div>';
  try {
    const r = await api({ action: 'journal', doc: r0.doc, op: r0.op });
    if (rule !== r0) return;
    if (!r.ok) { $('j-list').innerHTML = '<div class="why">' + esc(r.error) + '</div>'; return; }
    journal = r.ops;
    $('j-list').innerHTML = journal.length ? journal.map((x, i) => {
      const good = x.status === 'Учтено', who = x.who.replace(/^Telegram: /, '');
      return '<div class="row" data-i="' + i + '"><div class="top"><span>' + ruDay(x.day) + (who ? ' · ' + esc(who) : '') + '</span>' +
        '<span class="' + (good ? 'ok' : 'no') + '">' + esc(x.status) + '</span></div><div class="sub">' + esc(opLine(x)) + '</div></div>';
    }).join('') : '<div class="total">Операций пока нет.</div>';
    $('j-list').querySelectorAll('.row').forEach(el => el.onclick = () => openOp(journal[el.dataset.i]));
  } catch (e) { if (rule === r0) $('j-list').innerHTML = '<div class="why">Нет связи: ' + esc(e.message) + '</div>'; }
}
function openOp(x) {
  const line = (k, v) => v === '' || v === null || v === undefined ? '' : '<tr><td class="sub">' + k + '</td><td>' + esc(v) + '</td></tr>';
  $('v-body').innerHTML = '<div class="step">' + esc(rule.doc + ' / ' + rule.op) + '</div><table>' +
    line('Дата', ruDay(x.day)) +
    line('Количество', has(x.qty) ? fmt(x.qty) + ' шт.' : '') +
    line(rule.mode === 'winding' || rule.coil ? 'Длина катушки' : 'Изделие', has(x.product) ? fmt(x.product) + ' м' : has(x.length) ? fmt(x.length) + ' м' : '') +
    line('Оптоволокно', Number(x.metres) ? fmt(x.metres / 1000) + ' км' : '') +
    line('Примечание', x.note) + line('Статус', x.status) + line('Причина', x.message) +
    line('Внесено', x.entered) + line('Кто провёл', x.who.replace(/^Telegram: /, '')) + '</table>';
  $('journalBox').hidden = true; $('viewBox').hidden = false; window.scrollTo(0, 0); setBack(showJournal);
}

function clearFields() { ['metres', 'qty', 'length', 'productLength', 'note'].forEach(id => $(id).value = ''); recalc(); }

// Пустое или нулевое число не отправляем: сервер всё равно откажет, а человек ждал бы ответа зря.
function checkOp(op) {
  const whole = v => Number.isInteger(num(v)) && num(v) > 0;
  if (op.date && op.date < $('date').min && $('date').min === today()) return 'Задним числом документ может провести только администратор.';
  if (!op.date || op.date < $('date').min) return 'Дата — не раньше ' + $('date').min.split('-').reverse().join('.') + '.';
  if (op.date > today()) return 'Дата документа не может быть позже сегодняшней.';
  if (/[.,]/.test((op.metres || '') + (op.qty || ''))) return 'Пишите числа цифрами без точек и запятых, например 10000.';
  if (rule.mode === 'metres' && !whole(op.metres)) return 'Укажите метры оптоволокна целым числом больше нуля.';
  if (rule.mode !== 'metres' && !whole(op.qty)) return 'Укажите количество катушек целым числом больше нуля.';
  if (rule.mode === 'winding' && !(num(op.length) > 0)) return 'Выберите длину одной катушки из списка.';
  if (rule.product && !(op.productLength > 0)) return 'Выберите ' + (rule.coil ? 'длину катушки' : 'изделие') + ' из списка.';
  return '';
}

function recalc() {
  if (rule && rule.mode === 'winding') {
    const m = num($('qty').value) * num($('length').value);
    $('total').textContent = m > 0 ? 'Спишется оптоволокна: ' + fmt(m / 1000) + ' км' : '';
  } else $('total').textContent = '';
}

// Операция без ответа сервера (обрыв связи) хранится на телефоне, пока ответ не придёт: если приложение закрыли,
// при следующем открытии она досылается под тем же номером — дошедшую в прошлый раз сервер не задвоит.
const PENDING = 'namotka.pending';
function userId() { return tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? String(tg.initDataUnsafe.user.id) : ''; }
function savePending(op) { try { localStorage.setItem(PENDING, JSON.stringify({ user: userId(), op })); } catch (e) {} }
function dropPending() { try { localStorage.removeItem(PENDING); } catch (e) {} }
function loadPending() {
  try { const p = JSON.parse(localStorage.getItem(PENDING) || 'null'); return p && p.op && p.user === userId() ? p.op : null; }
  catch (e) { return null; }
}
function opLabel(op) {
  return op.doc + ' / ' + op.op + ', ' + String(op.date).split('-').reverse().join('.') +
    (op.metres ? ', ' + fmt(op.metres / 1000) + ' км' : ', ' + op.qty + ' шт.') + (op.length ? ' по ' + op.length + ' м' : '') +
    (op.productLength ? ', изделие ' + op.productLength + ' м' : '');
}

async function resendPending() {
  const op = loadPending(); if (!op) return;
  show('Досылаю операцию, на которую в прошлый раз не пришёл ответ: ' + opLabel(op) + '…');
  try {
    const r = await api({ action: 'post', op });
    dropPending();
    if (!r.ok) show('Не проведена операция ' + opLabel(op) + ': ' + r.error, 'bad');
    else if (r.duplicate) show('Операция ' + opLabel(op) + ' уже была проведена: ' + r.status, 'good');
    else if (r.status === 'Учтено') show('Дослано и учтено: ' + opLabel(op), 'good');
    else show('Не проведено: ' + opLabel(op) + '. ' + (r.message || ''), 'bad');
  } catch (e) { show('Операция ' + opLabel(op) + ' пока не дошла: нет связи. Досылка повторится при следующем открытии.', 'bad'); }
}

async function send() {
  if (!rule) return;
  const op = { clientId, doc: rule.doc, op: rule.op, date: $('date').value, note: $('note').value.trim() };
  if (rule.mode === 'metres') op.metres = $('metres').value;
  else op.qty = $('qty').value;
  if (rule.mode === 'winding') op.length = $('length').value;
  if (rule.product) op.productLength = Number($('productLength').value);
  const bad = checkOp(op);
  if (bad) { show(bad, 'bad'); return; }
  // После обрыва связи повтор с теми же числами идёт под прежним номером (дубля не будет),
  // а с другими числами — это уже новая операция под новым номером.
  const sig = JSON.stringify(Object.assign({}, op, { clientId: '' }));
  if (failedSig && failedSig !== sig) { clientId = newId(); op.clientId = clientId; }
  failedSig = null;
  $('send').disabled = true; show('Отправляю…');
  savePending(op);
  try {
    const r = await api({ action: 'post', op });
    // Устаревшая сессия: сервер операцию не видел — она остаётся на телефоне и дошлётся после переоткрытия.
    if (!r.ok && /Сессия устарела/.test(r.error || '')) { failedSig = sig; show(r.error + ' Введённая операция не пропадёт: после открытия она дошлётся сама.', 'bad'); return; }
    dropPending();
    if (!r.ok) { failedSig = sig; show(r.needRole ? 'Доступ снят. Обратитесь к владельцу.' : r.error, 'bad'); return; }
    if (r.duplicate) show('Эта операция уже была проведена: ' + r.status, 'good');
    else if (r.status === 'Учтено') show('Учтено: ' + rule.doc + ' / ' + rule.op + (r.message ? '\n' + r.message : ''), 'good');
    else show('Не проведено. ' + (r.message || ''), 'bad');
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(r.status === 'Учтено' || r.duplicate ? 'success' : 'error');
    clientId = newId();
    // Отказ (не хватает остатка и т. п.) поля не очищает: человек поправит и проведёт снова.
    if (r.duplicate || r.status === 'Учтено') { clearFields(); showJournal(); loadJournal(); }
  } catch (e) {
    // clientId не меняем: повторная отправка тех же чисел не задвоит операцию.
    failedSig = sig;
    show('Нет связи: ' + e.message + '\nМожно нажать «Провести» ещё раз — дубля не будет. Если поменяете числа, это будет новая операция.', 'bad');
  } finally { $('send').disabled = false; }
}

// Ввод остатков — только у Администратора; пишет лист «Начальные остатки», не журнал.
async function pickOpening(btn) {
  rule = null;
  document.querySelectorAll('.docs button').forEach(b => b.classList.toggle('on', b === btn));
  $('opsBox').hidden = true; $('fields').hidden = true; $('openingBox').hidden = true; hideJournal(); show('Загружаю остатки…');
  $('op-date').max = today(); if (!$('op-date').value) $('op-date').value = today();
  try {
    const r = await api({ action: 'opening' });
    if (!r.ok) { show(r.error, 'bad'); return; }
    renderOpening(r); $('openingBox').hidden = false; show('');
  } catch (e) { show('Нет связи: ' + e.message, 'bad'); }
}

function opField(box, id, label, value, mode) {
  const d = document.createElement('div'), l = document.createElement('label'), i = document.createElement('input');
  l.htmlFor = id; l.textContent = label; i.id = id; i.inputMode = mode; i.value = value === null ? '' : String(value);
  d.append(l, i); box.append(d);
}

let opGroups = [];

function renderOpening(r) {
  $('op-fibre').innerHTML = ''; $('op-groups').innerHTML = ''; opGroups = r.groups;
  opField($('op-fibre'), 'of', r.fibre.name + ', ' + r.fibre.unit, r.fibre.value, 'numeric');
  r.groups.forEach((g, k) => {
    const head = document.createElement('div'), grid = document.createElement('div'), total = document.createElement('div');
    head.className = 'group'; head.textContent = g + ', шт.'; grid.className = 'grid2'; total.className = 'total'; total.id = 'og-total' + k;
    r.lengths.forEach((l, j) => opField(grid, 'op' + (k * 8 + j), l.toLocaleString('ru-RU') + ' м', r.products[k * 8 + j], 'numeric'));
    $('op-groups').append(head, grid, total);
  });
  $('op-entered').textContent = r.entered ? 'Последний ввод: ' + r.entered : 'Остатки ещё не вносились.';
  recalcOpening();
}

function opValues() {
  return { date: $('op-date').value, fibre: $('of').value.trim(), products: Array.from({ length: opGroups.length * 8 }, (_, k) => $('op' + k).value.trim()) };
}

function recalcOpening() {
  const v = opValues().products;
  opGroups.forEach((g, k) => {
    const part = v.slice(k * 8, k * 8 + 8);
    $('og-total' + k).textContent = part.every(x => x !== '' && num(x) >= 0)
      ? 'Всего: ' + part.reduce((s, x) => s + num(x), 0).toLocaleString('ru-RU') + ' шт.'
      : 'Всего посчитается, когда заполнены все 8 метражей.';
  });
}

function checkOpening(v) {
  if (!v.date) return 'Укажите дату пересчёта.';
  if (v.date > today()) return 'Дата пересчёта не может быть позже сегодняшней.';
  if ([v.fibre].concat(v.products).some(x => /[.,]/.test(x))) return 'Пишите числа цифрами без точек и запятых, например 10000.';
  const bad = (x, whole) => x !== '' && !(num(x) >= 0 && (!whole || Number.isInteger(num(x))));
  if (bad(v.fibre, true)) return 'Оптоволокно: целое число метров от 0 или пусто.';
  const p = v.products.findIndex(x => bad(x, true));
  if (p >= 0) return opGroups[Math.floor(p / 8)] + ' ' + $('op' + p).previousSibling.textContent + ': целое число от 0 или пусто.';
  return '';
}

async function saveOpening() {
  const values = opValues(), bad = checkOpening(values);
  if (bad) { show(bad, 'bad'); return; }
  $('op-save').disabled = true; show('Сохраняю…');
  try {
    const r = await api({ action: 'saveOpening', values });
    if (!r.ok) { show(r.error, 'bad'); return; }
    renderOpening(r);
    const all = [values.fibre].concat(values.products), filled = all.filter(x => x !== '').length;
    show('Остатки сохранены: заполнено ' + filled + ' из ' + all.length + '.', 'good');
  } catch (e) { show('Нет связи: ' + e.message + '\nМожно нажать «Сохранить» ещё раз.', 'bad'); }
  finally { $('op-save').disabled = false; }
}

// Отчёты: операции по дням за период и остатки на конец дня «по». Только чтение.
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = v => Number(v).toLocaleString('ru-RU', { maximumFractionDigits: 3 });
const ruDay = d => d.split('-').reverse().join('.');
const has = v => v !== '' && v !== null && v !== undefined;
function plural(n) { const t = n % 10, h = n % 100; return t === 1 && h !== 11 ? 'операция' : t >= 2 && t <= 4 && (h < 12 || h > 14) ? 'операции' : 'операций'; }

function tab(rep) {
  $('tab-docs').classList.toggle('on', !rep); $('tab-rep').classList.toggle('on', rep);
  $('form').hidden = rep; $('repBox').hidden = !rep; show('');
  setBack(!rep && (!$('fields').hidden || !$('viewBox').hidden) ? showJournal : null);
  if (rep) loadReport();
}

function opLine(x) {
  const parts = [];
  if (has(x.qty)) parts.push(fmt(x.qty) + ' шт.');
  if (has(x.product)) parts.push('изделие ' + fmt(x.product) + ' м');
  else if (has(x.length)) parts.push('катушка ' + fmt(x.length) + ' м');
  if (Number(x.metres)) parts.push('оптоволокно ' + fmt(x.metres / 1000) + ' км');
  if (x.note) parts.push(x.note);
  return parts.join(' · ');
}

let lastReport = null;
// Разделы отчёта свёрнуты по умолчанию; раскрытые остаются раскрытыми при перестройке отчёта (слово владельца 14.10).
const openSecs = new Set();
const sec = (k, title, body) => '<details class="sec" data-k="' + k + '"' + (openSecs.has(k) ? ' open' : '') + '><summary>' + esc(title) + '</summary>' + body + '</details>';
function renderReport(r) {
  lastReport = r;
  // Пустая позиция — 0 или «не внесён»; без галочки «Показывать пустые» такие строки и колонки скрыты (слово владельца 14.10).
  const all = $('r-empty').checked, filled = v => v !== null && v !== 0;
  const days = {};
  r.ops.forEach(x => (days[x.day] = days[x.day] || []).push(x));
  let h = r.ops.length ? '' : '<div class="total">За выбранные дни операций нет.</div>';
  Object.keys(days).forEach(d => {
    h += '<div class="step" style="margin-top:16px">' + ruDay(d) + ' · ' + days[d].length + ' ' + plural(days[d].length) + '</div>';
    days[d].forEach(x => {
      const good = x.status === 'Учтено', who = x.who.replace(/^Telegram: /, '');
      h += '<div class="row"><div class="top"><span>' + (x.time ? 'внесено в ' + esc(x.time) : '') + (who ? ' · ' + esc(who) : '') + '</span>' +
        '<span class="' + (good ? 'ok' : 'no') + '">' + esc(x.status) + '</span></div>' +
        '<div class="what">' + esc(x.doc + ' · ' + x.op) + '</div><div class="sub">' + esc(opLine(x)) + '</div>' +
        (!good && x.message ? '<div class="why">' + esc(x.message) + '</div>' : '') + '</div>';
    });
  });
  $('r-ops').innerHTML = sec('ops', 'Операции за период · ' + r.ops.length, h);
  const val = (v, unit) => v === null ? '<span class="sub">не внесён</span>' : '<span class="' + (v < 0 ? 'no' : '') + '">' + fmt(v) + ' ' + unit + '</span>';
  let t = '<table>';
  // Оптоволокно показываем в километрах (слово владельца 14.10), вводится по-прежнему в метрах.
  // Под позицией — её номенклатура по метражам (слово владельца 15.10).
  const grp = i => (r.byAsset || []).indexOf(i), pad = '<td style="padding-left:18px" class="sub">';
  r.assets.forEach((a, i) => {
    if (!all && !filled(a.value)) return;
    const km = a.unit === 'м' && a.value !== null; t += '<tr><td>' + esc(a.name) + '</td><td class="n">' + val(km ? a.value / 1000 : a.value, km ? 'км' : a.unit) + '</td></tr>';
    const k = grp(i); if (k >= 0) r.lengths.forEach((l, j) => { const v = r.products[k * 8 + j]; if (all || filled(v)) t += '<tr>' + pad + 'Катушка ОВ ' + fmt(l) + ' м</td><td class="n">' + val(v, 'шт.') + '</td></tr>'; });
  });
  let b = sec('bal', 'Остатки на конец ' + ruDay(r.to), t + '</table>');
  if (r.movement) {
  // Движение за период и выпуск за период — отдельные разделы в самом низу (слово владельца 14.10).
    const km = a => a.unit === 'м', put = (a, v) => v === null ? '—' : fmt(km(a) ? v / 1000 : v);
    t = '<table><tr><td class="n sub">Начало</td><td class="n sub">Приход</td><td class="n sub">Расход</td><td class="n sub">Конец</td></tr>';
    r.assets.forEach((a, i) => {
      const inc = r.movement.in[i], out = r.movement.out[i];
      if (!all && !inc && !out) return;
      // Название — отдельной строкой над числами: в одну строку с ними таблица шире экрана телефона.
      t += '<tr><td colspan="4" style="border:0;padding-bottom:0">' + esc(a.name) + (km(a) ? ', км' : ', шт.') + '</td></tr><tr><td class="n">' + put(a, a.value === null ? null : a.value - inc + out) + '</td><td class="n">' + put(a, inc) + '</td><td class="n">' + put(a, out) + '</td><td class="n">' + put(a, a.value) + '</td></tr>';
      const k = grp(i), m = r.movement;
      if (k >= 0 && m.pin) r.lengths.forEach((l, j) => {
        const x = k * 8 + j, pi = m.pin[x], po = m.pout[x], v = r.products[x];
        if (!all && !pi && !po) return;
        t += '<tr>' + '<td colspan="4" style="border:0;padding:4px 0 0 18px" class="sub">' + 'Катушка ОВ ' + fmt(l) + ' м</td></tr><tr class="sub"><td class="n">' + put(a, v === null ? null : v - pi + po) + '</td><td class="n">' + put(a, pi) + '</td><td class="n">' + put(a, po) + '</td><td class="n">' + put(a, v) + '</td></tr>';
      });
    });
    t += '</table>';
    if (!all && r.assets.every((a, i) => !r.movement.in[i] && !r.movement.out[i])) t = '<div class="total">За период движения нет.</div>';
    b += sec('move', 'Движение за период', t);
  }
  if (r.output) {
    const o = r.output, ks = o.ops.map((x, k) => k).filter(k => all || o.qty[k].some(Boolean));
    if (!ks.length) t = '<div class="total">За период выпуска нет.</div>';
    else {
      t = '<table><tr><td class="sub">Метраж</td>' + ks.map(k => '<td class="n sub">' + esc(o.ops[k]).replace(/([а-яё]{4})(?=[а-яё]{3})/gi, '$1&shy;') + '</td>').join('') + '</tr>';
      r.lengths.forEach((l, i) => (all || ks.some(k => o.qty[k][i])) && (t += '<tr><td style="white-space:nowrap">' + fmt(l) + ' м</td>' + ks.map(k => '<td class="n">' + fmt(o.qty[k][i]) + '</td>').join('') + '</tr>'));
      t += '<tr><td><b>Итого</b></td>' + ks.map(k => '<td class="n"><b>' + fmt(o.qty[k].reduce((x, y) => x + y, 0)) + '</b></td>').join('') + '</tr></table>';
    }
    if (all || o.metres) t += '<div class="total">Оптоволокна на намотку и перемотку: ' + fmt(o.metres / 1000) + ' км.</div>';
    b += sec('out', 'Выпуск за период, шт.', t);
  }
  $('r-bal').innerHTML = b + '<div class="total">По операциям со статусом «Учтено». «—» и «не внесён» — начальный остаток ещё не внесён.' + (all ? '' : ' Нули и невнесённые скрыты.') + '</div>';
  document.querySelectorAll('#repBox details.sec').forEach(d => d.ontoggle = () => d.open ? openSecs.add(d.dataset.k) : openSecs.delete(d.dataset.k));
}

async function loadReport() {
  const from = $('r-from').value, to = $('r-to').value;
  if (!from || !to || from > to) { show('Выберите период: дата «с» не позже даты «по».', 'bad'); return; }
  $('r-show').disabled = true; show('Загружаю…');
  try {
    const r = await api({ action: 'report', from, to });
    if (!r.ok) { show(r.error, 'bad'); return; }
    renderReport(r); show('');
  } catch (e) { show('Нет связи: ' + e.message, 'bad'); }
  finally { $('r-show').disabled = false; }
}

async function start() {
  if (tg) { tg.ready(); tg.expand(); }
  if (!tg || !tg.initData) { $('who').textContent = 'Откройте приложение из бота в Telegram.'; return; }
  try {
    const r = await api({ action: 'whoami' });
    if (r.needRole) { $('who').textContent = 'Доступа пока нет. Ваш номер в Telegram: ' + r.id + '. Владелец назначит роль, затем откройте приложение заново.'; return; }
    if (!r.ok) { $('who').textContent = r.error; return; }
    $('who').textContent = r.name + ' · ' + r.role;
    rules = r.rules;
    $('productLength').innerHTML = '<option value="">— выберите —</option>' + r.lengths.map(l => '<option value="' + l + '">Катушка ОВ ' + l.toLocaleString('ru-RU') + ' м</option>').join('');
    $('length').innerHTML = '<option value="">— выберите —</option>' + r.lengths.map(l => '<option value="' + l + '">' + l.toLocaleString('ru-RU') + ' м</option>').join('');
    $('docs').innerHTML = '';
    rules.map(x => x.doc).filter((d, i, all) => all.indexOf(d) === i).forEach(doc => {
      const b = document.createElement('button');
      b.textContent = doc;
      b.onclick = () => pickDoc(doc, b); $('docs').append(b);
    });
    if (r.opening) {
      const b = document.createElement('button');
      b.textContent = 'Ввод остатков';
      b.onclick = () => pickOpening(b); $('docs').append(b);
    }
    // Задним числом проводит только администратор (сервер проверяет то же самое).
    if (r.role !== 'Администратор' && today() > $('date').min) $('date').min = today();
    $('date').max = today();
    $('date').value = defaultDate();
    $('r-from').value = $('r-to').value = $('date').value;
    $('form').hidden = false; $('tabs').hidden = false;
    await resendPending();
  } catch (e) { $('who').textContent = 'Нет связи с учётом: ' + e.message; }
}

['qty', 'length'].forEach(id => $(id).addEventListener('input', recalc));
$('send').onclick = send;
$('j-new').onclick = newOp;
$('v-back').onclick = $('f-back').onclick = showJournal;
if (tg && tg.BackButton) tg.BackButton.onClick(() => backFn && backFn());
$('op-save').onclick = saveOpening;
$('tab-docs').onclick = () => tab(false);
$('tab-rep').onclick = () => tab(true);
$('r-show').onclick = loadReport;
// Галочка — отдельное действие над уже показанным отчётом; положение помнится между входами (слово владельца 14.10).
try { $('r-empty').checked = localStorage.getItem('namotka.showEmpty') === '1'; } catch (e) {}
$('r-empty').onchange = () => {
  try { localStorage.setItem('namotka.showEmpty', $('r-empty').checked ? '1' : ''); } catch (e) {}
  if (lastReport) renderReport(lastReport);
};
$('openingBox').addEventListener('input', recalcOpening);
start();
</script>
